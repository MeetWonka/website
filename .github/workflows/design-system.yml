name: Design system

on:
  pull_request:
    paths:
      - ".storybook/**"
      - "apps/design-system-docs/**"
      - "design-system/**"
      - "packages/**"
      - "public/**"
      - "scripts/design-system/**"
      - "src/**"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vitest.shims.d.ts"
      - "package.json"
      - "bun.lock"
      - "eslint.config.mjs"
      - ".github/workflows/design-system.yml"
  push:
    branches:
      - main
    paths:
      - ".storybook/**"
      - "apps/design-system-docs/**"
      - "design-system/**"
      - "packages/**"
      - "public/**"
      - "scripts/design-system/**"
      - "src/**"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vitest.shims.d.ts"
      - "package.json"
      - "bun.lock"
      - "eslint.config.mjs"
      - ".github/workflows/design-system.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated contracts
        run: bun run ds:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint design-system scope
        run: >
          bunx eslint
          .storybook
          packages
          scripts/design-system
          src/design-system
          src/components/ui/*.stories.tsx
          src/components/ui/button.tsx
          src/components/ui/badge.tsx
          src/components/ui/eyebrow.tsx
          src/components/ui/logo.tsx
          src/components/ui/logo-mark.tsx
          src/components/ui/section.tsx
          src/components/ui/surface.tsx
          src/lib/design-tokens.ts
          src/lib/fonts.ts
          src/app/design-system/page.tsx
          postcss.config.mjs
          vitest.config.ts

      - name: Build deployable Storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: bun run --cwd apps/design-system-docs build

      - name: Install Chromium
        run: bunx playwright install chromium --with-deps

      - name: Test Storybook in light and dark themes
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: bun run test:storybook

      - name: Verify static discovery
        run: |
          test -f apps/design-system-docs/dist/index.html
          test -f apps/design-system-docs/dist/index.json
          test -f apps/design-system-docs/dist/.well-known/design-system.json
          test -f apps/design-system-docs/dist/design-system/manifest.json
          test -f apps/design-system-docs/dist/design-system/channels.json
          test -f apps/design-system-docs/dist/design-system/rules.json
          test -f apps/design-system-docs/dist/design-system/patterns.json
          test -f apps/design-system-docs/dist/design-system/schemas/pattern-catalog.schema.json
